# PLANTILLA FIJA - igual para todos los sembradores.
#
# Clave = ruta del campo (sin el prefijo /aofpSYF3s4WGcra4oLPYev/).
# Valor = TEXTO visible de la opcion (no el value interno). Listas = varias opciones.
#   null  -> PENDIENTE (no se llena y se reporta si es obligatorio)
#   campo ausente -> no se toca
# Todo es editable desde la app (pestana "Plantilla").

campos:
