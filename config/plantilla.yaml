  group_eq6af71/ruta: RUTA ZONA 7              # ruta 300 del catalogo = "RUTA ZONA 7"
  group_eq6af71/_Cu_ntos_predios_conforman_la_: 1
  group_eq6af71/A_o_de_ingreso: 2020

  # --- Unidad productiva (UP) -------------------------------------------------
  up/N_mero_de_UP_levantada: 1
  up/Uso_de_suelo_inicial: Cultivo de milpa
  up/Pendiente_promedio: "8° a 20°"
  up/sistema: SAF y MIAF
  up/Total_de_Hect_reas_SAF: 1
  up/Total_de_Hect_reas_MIAF: 1.5
  up/_La_UP_tiene_problemas_del_suelo: [deficiencia de materia orgánica, poca fertilidad]
  up/El_a_o_pasado_la_UP_tubo_pro: "No"        # altas densidades
  up/_La_UP_tiene_alta_mortandad_de: "Sí"
  up/Causas_mortandad_de_plantas: Plaga, Hielo
  up/Tasa_de_mortandad: 60
  up/_Tiene_colmenas_en_la_UP: "No"
  up/poda_001: "No"                            # poda del arbolado frutal
  up/_Requiere_poda_del_arbolado_ag: "No"
  up/_Cuenta_con_bit_cora_de_producci_n: "No"
  up/disp_agua: [Temporal de lluvia, Río/Arroyo/Laguna temporal, Manantial]
  up/_Existe_alg_n_m_todo_para_alma: "No"
  up/Presencia_de_obras_de_conserva:
    - Terraza tabla, Terrazas individuales
    - Bordos, Muros con piedra acomodada
    - Barreras rompevientos, Cercos vivos
  up/_Las_pr_cticas_que_h_la_calidad_del_suelo: null   # PENDIENTE: definir con el jefe
  up/Porcentaje_de_suelo_por_M_O_u_hojarasca: "0 - 10%"  # la plantilla original dice 0%; la opcion mas baja es 0-10%
  up/Raleo_de_planta: "No"

  # --- Eventos climaticos ------------------------------------------------------
  up/El_a_o_pasado_Cu_le_los_que_correspondan: [Nortes/Frentes fríos, Heladas, Granizadas]
  up/El_a_o_pasado_de_los_eventos: [Disminución o pérdida de la cosecha, Cambios en la floración, Otra afectación]
  up/Especifique_otra_afectaci_n: Secamiento de la planta
  up/El_a_o_pasado_qu_ctadas_en_su_parcela: Muy afectada (más del 50 % de la producción)

  # --- Manejo agroecologico ---------------------------------------------------
  up/Labranza: Labranza cero
  up/El_a_o_pasado_cu_n_manejo_de_su_parcela: Nunca
  up/El_a_o_pasado_cu_n_r_el_uso_del_tractor: No gastó nada (no usó tractor, o tiene uno propio)
  up/arv_manejo_up: Control manual (deshierbe con machete, azadón u otras herramientas)
  up/Superficie_total_en_plic_la_composta_ha: 1
  up/Elaboracion_propia: 0
  up/Biofabrica: 100
  up/Compra_local_: 0
  up/Compra_regional_: 0
  up/_Se_realiza_la_incorporaci_n_d: "Sí"      # rastrojo
  up/_En_qu_sistema_se_r_iza_la_incorporaci_n: MIAF

